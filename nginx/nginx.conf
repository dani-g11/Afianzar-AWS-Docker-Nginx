# nginx/nginx.conf
# Tutorial 06: El Primer Estrangulamiento (Strangler Pattern).
# Nginx decide a que backend enviar la peticion segun la version de la API.

# Backend v1: el monolito Django + Gunicorn.
upstream django_v1 {
    server web_django:8000;
}

# Backend v2: el microservicio Flask (el "estrangulador").
upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;

    # Ignorar logs de favicon para no saturar el servidor.
    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTA NUEVA (v2): estrangulamos la funcion de compra y la mandamos a Flask.
    # Debe declararse ANTES que /api/v1/ no es necesario aqui porque son prefijos
    # distintos, pero mantenemos la ruta especifica de compra apuntando a Flask.
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RUTA VIEJA (v1): sigue yendo a Django.
    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Trafico raiz restante tambien al monolito (admin, vistas HTML, etc.).
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
