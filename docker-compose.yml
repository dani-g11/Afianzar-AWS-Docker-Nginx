# Tutorial 06: Strangler Pattern (Opcion A: SQLite).
#
#   Internet --> [nginx :80] --+--> /api/v1/ , /  --> [web_django: Gunicorn/Django :8000]
#                              +--> /api/v2/comprar --> [pagos_flask: Gunicorn/Flask :5000]
#
# Nginx es el unico que da la cara a internet. Decide a que backend enviar
# cada peticion segun la version de la API (el "estrangulamiento").

services:
  web_django:  # El Monolito (v1).
    build: .
    command: gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    # Aislado: sin 'ports'. Solo Nginx le habla por la red interna.

  pagos_flask:  # El Microservicio (v2) - EL ESTRANGULADOR.
    build: ./microservicio_pagos
    ports:
      - "5000:5000"  # Expuesto solo para pruebas iniciales; luego se puede cerrar.

  nginx:  # Proxy inverso / cerebro del ruteo.
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web_django
      - pagos_flask
