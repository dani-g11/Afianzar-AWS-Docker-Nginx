# Tutorial 05: Arquitectura de produccion de 3 capas (Opcion A: SQLite).
#
#   Internet --> [nginx :80] --> [web: Gunicorn/Django :8000] --> SQLite
#
# Nginx es el unico servicio que da la cara a internet (puerto 80).
# Django queda AISLADO: ya no expone puertos al host, solo Nginx le habla
# por la red interna de Docker.

services:
  web:
    build: .
    # CAMBIO 1: usamos Gunicorn en lugar de runserver.
    # 'Tienda' es la carpeta donde esta wsgi.py (Tienda/wsgi.py).
    command: gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000
    volumes:
      # Mapeamos el codigo (incluye db.sqlite3) para no reconstruir en cada cambio.
      - .:/app
    # NOTA: Ya no hay seccion 'ports' aqui. Django esta aislado del exterior.

  # CAMBIO 2: agregamos el servicio Nginx como Proxy Inverso.
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"  # Nginx es el unico que da la cara a internet.
    volumes:
      # Inyectamos nuestro archivo de configuracion en el contenedor.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
